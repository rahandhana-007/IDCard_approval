<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cek Keaslian Kartu v3.50 — ID Card Management</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%234f46e5'/%3E%3Cstop%20offset='1'%20stop-color='%236d28d9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20x='4'%20y='12'%20width='56'%20height='40'%20rx='7'%20fill='url(%23g)'/%3E%3Crect%20x='4'%20y='20'%20width='56'%20height='8'%20fill='%231e1b4b'/%3E%3Crect%20x='10'%20y='35'%20width='13'%20height='10'%20rx='2.5'%20fill='%23fbbf24'/%3E%3Crect%20x='29'%20y='37'%20width='25'%20height='3.5'%20rx='1.75'%20fill='%23c7d2fe'/%3E%3Crect%20x='29'%20y='44'%20width='16'%20height='3.5'%20rx='1.75'%20fill='%23a5b4fc'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--brand:#4f46e5;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--line2:#cbd5e1;--ok:#047857;--okbg:#ecfdf5;--err:#b91c1c;--errbg:#fef2f2}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f6f7ff,#eef1f8);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:560px}
.result{border-radius:16px;padding:26px 22px;border:1px solid var(--line);background:#fff;box-shadow:0 10px 30px rgba(15,23,42,.07);text-align:center}
.result.ok{background:var(--okbg);border-color:#a7f3d0}
.result.err{background:var(--errbg);border-color:#fecaca}
.result h3{margin:0;font-size:24px;line-height:1.3;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.result.ok h3{color:var(--ok)}
.result.err h3{color:var(--err)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;letter-spacing:.02em}
.chip.red{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.55}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.sigbox{margin:18px auto 0;padding:14px;border:1px solid var(--line2);border-radius:14px;background:#fff;max-width:360px}
.sigbox img{display:block;margin:0 auto;max-height:110px;max-width:100%}
.btn{appearance:none;border:1px solid var(--line2);background:#fff;color:var(--ink);padding:11px 18px;border-radius:12px;font:inherit;font-size:14px;font-weight:650;cursor:pointer;margin-top:10px}
.btn.primary{background:linear-gradient(135deg,#4f46e5,#6d28d9);border-color:#4f46e5;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pinwrap{margin:14px auto 0;max-width:250px}
.pinwrap input{width:100%;padding:12px;border:1px solid var(--line2);border-radius:12px;font:inherit;font-size:20px;letter-spacing:.5em;text-align:center}
.pinwrap input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
dl.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 14px;margin:16px 0 0;font-size:13.5px;text-align:left}
dl.kv dt{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
dl.kv dd{margin:0;word-break:break-word}
@media(max-width:560px){dl.kv{grid-template-columns:1fr}}
.cohead{border-bottom:1px solid var(--line2);padding-bottom:12px;margin-bottom:14px}
.co1{margin:0;font-size:17px;font-weight:800;letter-spacing:.02em;color:var(--ink)}
.co2{margin:3px 0 0;font-size:12.5px;font-weight:600;color:var(--muted)}
.siglabel{margin:0 0 8px;font-size:11.5px;font-weight:800;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.signame{margin:10px 0 0;font-weight:800;font-size:16px;color:var(--ink)}
.sigtitle{margin:2px 0 0;font-size:13.5px;color:var(--ink);font-weight:700}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <div id="result" class="result"><h3>Memeriksa kartu…</h3></div>
</main>
<script>
"use strict";
/* =====================================================================
   PLATFORM CEK KEASLIAN KARTU — v3.10: HALAMAN PUTUSAN MINIMAL.
   Dibuka lewat link QR kartu (?card=<ref>) → otomatis menampilkan:
     ✓ KARTU INI ASLI  + tanda tangan manager pengesah di bawahnya.
   Sesuai permintaan pengguna, SEMUA UI lain dibuang: textbox tempel,
   tombol Periksa/Scan/Instal, modul scanner kamera, caption & footer.
   Mesin verifikasi IDENTIK dengan aplikasi ID Card Management:
   canonical string KS3/KS2 + ECDSA P-256 / RSA-2048 (Web Crypto).
   Payload + tanda tangan diambil dari Supabase RPC card_by_ref (anon);
   kunci publik penerbit dari RPC public_signing_keys (anon).
   Koneksi server: parameter URL ?sb_url&sb_key > build tertanam > localStorage.
   ===================================================================== */
const EMBEDDED_SB_URL = "/*SB_URL*/";
const EMBEDDED_SB_KEY = "/*SB_KEY*/";
const LS_CFG = "kartusign.sb.config.v1";
const enc = new TextEncoder();
const $ = (id) => document.getElementById(id);
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

/* ---------------- konfigurasi server ---------------- */
function getSbConfig(){
  try{
    const p = new URL(location.href).searchParams;
    const u = (p.get("sb_url") || p.get("sburl") || "").trim(), k = (p.get("sb_key") || p.get("sbkey") || "").trim();
    if (u && k) return { url: u, key: k };
  }catch(e){}
  if (EMBEDDED_SB_URL && EMBEDDED_SB_KEY && EMBEDDED_SB_URL.indexOf("/*SB_") !== 0) return { url: EMBEDDED_SB_URL, key: EMBEDDED_SB_KEY };
  try{
    const raw = localStorage.getItem(LS_CFG);
    if (raw){ const c = JSON.parse(raw); if (c && c.url && c.key) return { url: String(c.url), key: String(c.key) }; }
  }catch(e){}
  return null;
}

/* ---------------- kriptografi (identik dengan aplikasi utama) ---------------- */
const ALG = {
  ES256: { genParams: { name:"ECDSA", namedCurve:"P-256" } },
  RS256: { genParams: { name:"RSASSA-PKCS1-v1_5", modulusLength:2048, publicExponent:new Uint8Array([1,0,1]), hash:"SHA-256" } }
};
function b64uToBytes(str){
  str = String(str).trim().replace(/-/g,"+").replace(/_/g,"/");
  while (str.length % 4) str += "=";
  const bin = atob(str);
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function pemToDer(pem){
  const body = pem.replace(/-----BEGIN [^-]+-----/g,"").replace(/-----END [^-]+-----/g,"").replace(/\s+/g,"");
  return b64uToBytes(body);
}
const OPTIONAL_FIELDS = ["cid","hld","apr","exp","rsn","sh","ss"];
const FIXED_TEXT = {
  "MP":  "Manager Purchasing",
  "PS1": "Kartu ini dinyatakan Sah dan Asli di keluarkan oleh Purchasing Section"
};
function expandFixed(v){ return FIXED_TEXT[v] || (v || ""); }
function normalizePayload(o){
  const out = { ...o };
  for (const k of OPTIONAL_FIELDS) if (out[k] == null) out[k] = "";
  return out;
}
function canonicalString(obj){
  const head = [
    obj.alg, obj.kid, String(obj.ts),
    obj.cid||"", obj.hld||"", obj.apr||"", obj.exp||"", obj.rsn||"", obj.h||""
  ];
  if ((obj.v || 1) >= 3) return ["KS3", ...head, obj.sh||"", obj.ss||""].join("|");
  return ["KS2", ...head].join("|");
}
function kidMatch(a, b){
  if (!a || !b) return true;
  return a === b || a.startsWith(b) || b.startsWith(a);
}
async function verifySignatureOf(obj, publicKey){
  const cs = canonicalString(obj);
  const digest = await crypto.subtle.digest("SHA-256", enc.encode(cs));
  const params = obj.alg === "ES256" ? { name:"ECDSA", hash:"SHA-256" } : { name:"RSASSA-PKCS1-v1_5" };
  return crypto.subtle.verify(params, publicKey, b64uToBytes(obj.s), digest);
}
async function importPublicPem(pem, alg){
  return crypto.subtle.importKey("spki", pemToDer(pem), ALG[alg].genParams, true, ["verify"]);
}

/* ---------------- ambil data dari server (anon) ---------------- */
async function fetchCardByRef(cfg, ref){
  const r = await fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/rpc/card_by_ref", {
    method: "POST",
    headers: { "apikey": cfg.key, "Content-Type": "application/json" },
    body: JSON.stringify({ p_ref: String(ref).toLowerCase() })
  });
  if (!r.ok){
    if (r.status === 404) throw new Error("Fungsi server card_by_ref belum ada — jalankan ulang supabase/schema.sql (v3.00+).");
    throw new Error("Server menolak permintaan link kartu (HTTP " + r.status + ").");
  }
  const j = await r.json();
  return Array.isArray(j) ? (j[0] || null) : (j && j.payload ? j : null);
}
async function fetchPublicKeys(cfg){
  const r = await fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/rpc/public_signing_keys", {
    method: "POST",
    headers: { "apikey": cfg.key, "Content-Type": "application/json" },
    body: "{}"
  });
  if (!r.ok){
    if (r.status === 503) throw new Error("Perangkat sedang offline dan kunci publik belum tersimpan di cache. Sambungkan sebentar ke internet agar kunci tersimpan — setelah itu pemeriksaan tetap jalan tanpa internet.");
    if (r.status === 404) throw new Error("RPC public_signing_keys belum ada di server — jalankan ulang supabase/schema.sql versi terbaru.");
    throw new Error("Gagal mengambil kunci publik dari server (HTTP " + r.status + ").");
  }
  const rows = await r.json();
  return Array.isArray(rows) ? rows : [];
}

/* ---------------- PIN gate (v3.20, RPC anon) ---------------- */
async function fetchPinActive(cfg){
  const r = await fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/rpc/cek_pin_active", {
    method: "POST", headers: { "apikey": cfg.key, "Content-Type": "application/json" }, body: "{}"
  });
  if (!r.ok){
    if (r.status === 404) throw new Error("Fungsi server cek_pin_active belum ada — jalankan ulang supabase/schema.sql (v3.20+).");
    throw new Error("Server menolak (HTTP " + r.status + ").");
  }
  const j = await r.json();
  return j === true || (Array.isArray(j) && j[0] === true);
}
async function fetchVerifyPin(cfg, pin){
  const r = await fetch(cfg.url.replace(/\/+$/, "") + "/rest/v1/rpc/verify_cek_pin", {
    method: "POST", headers: { "apikey": cfg.key, "Content-Type": "application/json" }, body: JSON.stringify({ p_pin: String(pin) })
  });
  if (!r.ok){
    if (r.status === 404) throw new Error("Fungsi server verify_cek_pin belum ada — jalankan ulang supabase/schema.sql (v3.20+).");
    throw new Error("Server menolak (HTTP " + r.status + ").");
  }
  const j = await r.json();
  return j === true || (Array.isArray(j) && j[0] === true);
}

/* ---------------- tampilan hasil ---------------- */
function fmtDate(ts){
  const d = new Date(Number(ts) * 1000);
  if (isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("id-ID", { day:"2-digit", month:"short", year:"numeric" }) + ", " +
         d.toLocaleTimeString("id-ID", { hour:"2-digit", minute:"2-digit" });
}
function show(cls, html){
  const out = $("result");
  out.className = "result " + cls;
  out.innerHTML = html;
}
function showErr(title, msg){
  show("err", `<h3>✗ ${esc(title)}</h3><p class="hint" style="margin:0">${msg}</p>`);
}

/* ---------------- verifikasi (mesin identik aplikasi utama) ----------------
   v3.30: putusan ✓ KARTU INI ASLI + gambar tanda tangan manager di bawah
   pernyataan + identitas pemilik kartu (seperti semula — permintaan pengguna).
   PENTING: profiles.sig_png disimpan aplikasi sebagai base64 POLOS (tanpa
   prefiks data:) → dinormalkan di sini agar <img> benar-benar tampil.
   Chip merah "masa berlaku habis" dipertahankan demi kebenaran putusan. */
async function verifyPayload(txt, resolved){
  try{
    let obj;
    try { obj = JSON.parse(String(txt == null ? "" : txt).trim()); }
    catch(e){ showErr("KARTU TIDAK ASLI", "Payload tidak valid — isi QR bukan JSON yang utuh."); return; }
    if (!(obj.v === 2 || obj.v === 3)){
      showErr("KARTU TIDAK ASLI", "Format payload lama (v" + esc(obj.v || 1) + ") tidak didukung platform ini. Tanda tangani ulang kartunya dengan aplikasi versi sekarang.");
      return;
    }
    obj = normalizePayload(obj);
    if (!obj.s || !obj.h){ showErr("KARTU TIDAK ASLI", "Payload tidak lengkap — field tanda tangan (s) atau hash (h) tidak ditemukan."); return; }
    if (!ALG[obj.alg]){ showErr("KARTU TIDAK ASLI", "Algoritma tidak dikenal: " + esc(obj.alg || "—")); return; }

    const cfg = getSbConfig();
    if (!cfg){ showErr("HALAMAN BELUM DIKONFIGURASI", "Koneksi server tidak ditemukan. Buka halaman ini dari build/link resmi (parameter <span class='mono'>?sb_url=…&sb_key=…</span>)."); return; }

    let keys;
    try { keys = await fetchPublicKeys(cfg); }
    catch(e){ showErr("SERVER TIDAK TERJANGKAU", esc(e.message || e)); return; }
    if (!keys.length){ showErr("SERVER BELUM PUNYA KUNCI", "Belum ada kunci penandatangan di server — manager harus membuat kunci terlebih dahulu di aplikasi ID Card Management."); return; }

    const cands = keys.filter(k => k && k.alg === obj.alg && k.pubkey_pem && kidMatch(k.kid, obj.kid));
    if (!cands.length){
      showErr("KARTU TIDAK ASLI", "Kunci publik penerbit dengan Key ID <span class='mono'>" + esc(obj.kid || "—") + "</span> tidak ditemukan di server. Kartu tidak diterbitkan oleh instansi ini, atau kunci penerbit sudah dihapus.");
      return;
    }
    let sigOk = false, used = null;
    for (const c of cands){
      try{
        const pub = await importPublicPem(c.pubkey_pem, c.alg);
        if (await verifySignatureOf(obj, pub)){ sigOk = true; used = c; break; }
      }catch(e){}
    }
    if (!sigOk){
      showErr("KARTU TIDAK ASLI", "Tanda tangan digital <b>tidak cocok</b> dengan isi payload — data kartu pernah diubah, atau payload tidak ditandatangani oleh kunci resmi instansi ini.");
      return;
    }
    const expired = obj.exp ? (new Date(obj.exp + "T23:59:59").getTime() < Date.now()) : false;
    const rawSig = (resolved && resolved.sig_png) ? String(resolved.sig_png) : (obj.ss ? String(obj.ss) : "");
    const sigSrc = rawSig ? (rawSig.indexOf("data:") === 0 ? rawSig : "data:image/png;base64," + rawSig) : "";
    const sigName = (resolved && (resolved.signed_name || resolved.signed_by)) ? String(resolved.signed_name || resolved.signed_by) : "";
    show("ok", `<div class="cohead">
        <p class="co1">PT. BRIDGESTONE SUMATRA RUBBER ESTATE</p>
        <p class="co2">Purchasing Section - Raw Material</p>
      </div>
      <h3>✓ KARTU INI ASLI${expired ? ' <span class="chip red">masa berlaku habis</span>' : ""}</h3>
      <dl class="kv">
        <dt>ID kartu</dt><dd class="mono">${esc(obj.cid || "—")}</dd>
        <dt>Pemegang</dt><dd>${esc(obj.hld || "—")}</dd>
        <dt>Ditetapkan</dt><dd>${esc(expandFixed(obj.apr) || "—")}</dd>
        <dt>Berlaku hingga</dt><dd>${esc(obj.exp || "—")}</dd>
        <dt>Keterangan</dt><dd>${esc(expandFixed(obj.rsn) || "—")}</dd>
        <dt>Diterbitkan</dt><dd>${esc(fmtDate(obj.ts))}</dd>
        <dt>Algoritma</dt><dd>${esc(obj.alg)} · Key ID <span class="mono">${esc((used && used.kid) || obj.kid || "—")}</span></dd>
      </dl>` +
      (sigSrc ? `<div class="sigbox">
        <p class="siglabel">TANDA TANGAN</p>
        <img src="${esc(sigSrc)}" alt="Tanda tangan pengesah">` +
        (sigName ? `<p class="signame">${esc(sigName)}</p>` : "") +
        `<p class="sigtitle">Purchasing Manager</p>
      </div>` : ""));
  }catch(e){
    showErr("GAGAL MEMERIKSA", esc((e && e.message) || e));
  }
}

/* ---------------- dibuka lewat link QR: PIN dulu, baru ambil kartu ----------------
   v3.20: data kartu TIDAK diambil sebelum PIN tervalidasi di server. */
let pinOk = false;
async function ensurePin(cfg){
  if (pinOk) return true;
  if (!(await fetchPinActive(cfg))) { pinOk = true; return true; }
  let saved = "";
  try{ saved = sessionStorage.getItem("kartusign.cek.pin") || ""; }catch(e){}
  if (saved && await fetchVerifyPin(cfg, saved)){ pinOk = true; return true; }
  return false;
}
function showPinScreen(ref, errMsg){
  const out = $("result");
  out.className = "result";
  out.innerHTML = `<h3>🔒 Masukkan PIN</h3>
    <p class="hint" style="margin:8px 0 0">Masukkan PIN dari petugas penerbit kartu untuk melihat putusan keaslian.</p>
    ${errMsg ? `<p class="hint" style="margin:8px 0 0;color:var(--err);font-weight:700">${errMsg}</p>` : ""}
    <div class="pinwrap">
      <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">
      <button class="btn primary" id="btnPin" type="button">Buka</button>
    </div>`;
  const inp = $("pinInput"), btn = $("btnPin");
  const submit = async ()=>{
    const pin = inp.value.trim();
    if (!pin) return;
    btn.disabled = true;
    const cfg2 = getSbConfig();
    try{
      if (cfg2 && await fetchVerifyPin(cfg2, pin)){
        pinOk = true;
        try{ sessionStorage.setItem("kartusign.cek.pin", pin); }catch(e){}
        checkCard(ref);
        return;
      }
      showPinScreen(ref, cfg2 ? "PIN salah — coba lagi." : "Koneksi server tidak ditemukan.");
    }catch(e){
      const netErr = (e && e.name === "TypeError") || /fetch|network|offline/i.test(String((e && e.message) || e));
      showPinScreen(ref, netErr ? "Perlu internet untuk memverifikasi PIN." : esc((e && e.message) || e));
    }
  };
  btn.addEventListener("click", submit);
  inp.addEventListener("keydown", (e)=>{ if (e.key === "Enter") submit(); });
  try{ inp.focus(); }catch(e){}
}
async function checkCard(ref){
  const r0 = String(ref == null ? "" : ref).trim();
  if (!r0){ showErr("TIDAK ADA KARTU", "Buka halaman ini dengan memindai QR code kartu."); return; }
  const cfg = getSbConfig();
  if (!cfg){ showErr("HALAMAN BELUM DIKONFIGURASI", "Link QR butuh koneksi server untuk mengambil data kartu. Buka halaman ini dari build/link resmi (parameter <span class='mono'>?sb_url=…&sb_key=…</span>)."); return; }
  try{
    if (!(await ensurePin(cfg))){ showPinScreen(r0, ""); return; }
  }catch(e){
    const netErr = (e && e.name === "TypeError") || /fetch|network|offline/i.test(String((e && e.message) || e));
    showErr(netErr ? "PERLU INTERNET" : "GAGAL MEMERIKSA PIN",
      netErr ? "Perangkat sedang offline — verifikasi PIN butuh koneksi ke server. Sambungkan ke internet lalu muat ulang halaman ini."
             : esc((e && e.message) || e));
    return;
  }
  let resolved;
  try{ resolved = await fetchCardByRef(cfg, r0); }
  catch(e){
    const netErr = (e && e.name === "TypeError") || /fetch|network|offline/i.test(String((e && e.message) || e));
    showErr(netErr ? "PERLU INTERNET" : "GAGAL MEMBUKA LINK",
      netErr ? "Perangkat sedang offline — data kartu diambil dari server sehingga butuh internet. Sambungkan ke internet lalu muat ulang halaman ini."
             : esc((e && e.message) || e));
    return;
  }
  if (!resolved || !resolved.payload){ showErr("KARTU TIDAK DITEMUKAN", "Link ini tidak merujuk ke kartu yang <b>disetujui</b> di server (ref <span class=\"mono\">" + esc(r0) + "</span>). Pastikan kartu sudah disetujui manager dan <b>supabase/schema.sql</b> terbaru sudah dijalankan (RPC card_by_ref)."); return; }
  await verifyPayload(resolved.payload, resolved);
}

window.CekKeaslian = {
  version: "v3.50",
  checkCard, verifyPayload,
  _resetPin(){ pinOk = false; try{ sessionStorage.removeItem("kartusign.cek.pin"); }catch(e){} }
};

/* ---------------- init ---------------- */
(function init(){
  if (!(window.crypto && crypto.subtle)){
    showErr("WEB CRYPTO TIDAK TERSEDIA", "Browser/koneksi ini tidak mendukung Web Crypto API. Buka halaman lewat https:// atau localhost.");
    return;
  }
  // dibuka lewat link QR (?card=…) → periksa otomatis
  const qCard = new URLSearchParams(location.search).get("card");
  if (qCard) checkCard(qCard);
  else showErr("TIDAK ADA KARTU", "Buka halaman ini dengan memindai QR code kartu.");
  // PWA: service worker hanya di konteks aman (https/localhost)
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
    window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  }
})();
</script>
</body>
</html>
